# ═══════════════════════════════════════════════════════════════════════════════════════════════
# Ametrine configuration: the only source of settings and key bindings.
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# Location: ~/.config/ametrine/ametrine.yml (or ~/.ametrine.yml). Menu: Edit Config… opens this
# file; Reload Config applies it (Ametrine relaunches).
#
# Settings: a setting left out gets its default (shown in each comment).
# Keys:     a command is bound only here, as {mod: mod1, key: h}. {mod: <NONE>, key: <NONE>},
#           false, or leaving it out = unbound. Unbound commands still run from the command
#           palette or with: open -g "ametrine://command/<command>".
#           key: a character (quote digits and symbols: "0", '.', ','), or space, enter, up,
#           down, left, right, delete.
# Reference: docs/configuration-files.md in the Ametrine repo.
#
# Sections:  1 Modifiers · 2 Palette and shortcuts · 3 Layouts · 4 Main pane · 5 Moving between windows
#            6 Screen space · 7 Which windows tile · 8 Window limit · 9 Mouse · 10 Focus border
#            11 Feedback and app


# ─── 1 Modifiers ───────────────────────────────────────────────────────────────────────────────
# Each is a list of shift, control, option, command. mod1 and mod2 are required.
# h/j/k/l = direction, modifier = verb: mod1 focuses, mod2 warps, mod3 swaps.

mod1: [control, option]                    # ⌃⌥    everyday: focus, layouts
mod2: [control, option, command]           # ⌃⌥⌘   warp, main count
mod3: [control, command]                   # ⌃⌘    swap
mod4: [shift, control, option, command]    # ⇧⌃⌥⌘  "Super"


# ─── 2 Palette and shortcuts ───────────────────────────────────────────────────────────────────
# The palette: every command with its shortcut; type to filter, Enter runs, Esc closes. The first
# key to bind. Shortcuts: your bound keys at a glance (also in the menu bar), Esc closes.

show-command-palette: {mod: mod1, key: p}
show-shortcuts:       {mod: <NONE>, key: <NONE>}


# ─── 3 Layouts ─────────────────────────────────────────────────────────────────────────────────
# How layouts work, main first: docs/layouts.md.

# The layouts the Layouts menu shows, the palette offers and cycle-layout steps through, in order.
# Keys: fullscreen, floating, tall-left, tall-right, wide-top, wide-bottom, two-pane-a,
# two-pane-b, 3column-left, 3column-middle, 3column-right, 4column-left, 4column-right,
# column-left, column-right, row-top, row-bottom, widescreen-tall-left, widescreen-tall-right,
# bsp. Default: tall-left, wide-top, fullscreen, column-left.
layouts:
  - fullscreen
  - floating
  - tall-left
  - tall-right
  - wide-top
  - wide-bottom
  - two-pane-a
  - two-pane-b
  - 3column-left
  - 3column-middle
  - 3column-right
  - 4column-left
  - 4column-right
  - column-left
  - column-right
  - row-top
  - row-bottom
  - widescreen-tall-left
  - widescreen-tall-right
  - bsp

# The name shown for a layout (menu bar, HUD, Layouts menu, palette), by key; quote it.
# A layout left out, or with an empty name, shows its key. Default: none (every layout shows its key).
layout-names:
  fullscreen: "Fullscreen"
  floating: "Floating"
  tall-left: "Tall Left"
  tall-right: "Tall Right"
  wide-top: "Wide Top"
  wide-bottom: "Wide Bottom"
  two-pane-a: "Two Pane A"
  two-pane-b: "Two Pane B"
  3column-left: "3Column Left"
  3column-middle: "3Column Middle"
  3column-right: "3Column Right"
  4column-left: "4Column Left"
  4column-right: "4Column Right"
  column-left: "Column Left"
  column-right: "Column Right"
  row-top: "Row Top"
  row-bottom: "Row Bottom"
  widescreen-tall-left: "Widescreen Tall Left"
  widescreen-tall-right: "Widescreen Tall Right"
  bsp: "Binary Space Partitioning"

# Keep each Space's layout, main count, ratio and pane sizes across restarts: true | false (default true).
restore-layouts-on-launch: true

# Next / previous layout in the list.
cycle-layout:          {mod: mod1, key: '.'}
cycle-layout-backward: {mod: mod1, key: ','}

# Switch to a layout (only those in layouts). Selecting the current one again goes back to the previous.
select-fullscreen-layout:            {mod: mod1, key: '1'}
select-floating-layout:              {mod: <NONE>, key: <NONE>}
select-tall-left-layout:             {mod: <NONE>, key: <NONE>}
select-tall-right-layout:            {mod: <NONE>, key: <NONE>}
select-wide-top-layout:              {mod: <NONE>, key: <NONE>}
select-wide-bottom-layout:           {mod: <NONE>, key: <NONE>}
select-two-pane-a-layout:            {mod: mod1, key: '2'}
select-two-pane-b-layout:            {mod: <NONE>, key: <NONE>}
select-3column-left-layout:          {mod: <NONE>, key: <NONE>}
select-3column-middle-layout:        {mod: mod1, key: '3'}
select-3column-right-layout:         {mod: <NONE>, key: <NONE>}
select-4column-left-layout:          {mod: <NONE>, key: <NONE>}
select-4column-right-layout:         {mod: <NONE>, key: <NONE>}
select-column-left-layout:           {mod: <NONE>, key: <NONE>}
select-column-right-layout:          {mod: <NONE>, key: <NONE>}
select-row-top-layout:               {mod: <NONE>, key: <NONE>}
select-row-bottom-layout:            {mod: <NONE>, key: <NONE>}
select-widescreen-tall-left-layout:  {mod: <NONE>, key: <NONE>}
select-widescreen-tall-right-layout: {mod: <NONE>, key: <NONE>}
select-bsp-layout:                   {mod: <NONE>, key: <NONE>}

# Switch this Space between its layout and Fullscreen, focused window in front (it doesn't become
# main); back, every window is in its tile. Works whether or not fullscreen is in layouts.
toggle-fullscreen: {mod: mod1, key: z}

# Flip: flip-twin shows the mirror image (the twin, with main count, ratio and pane sizes; in
# 3Column Middle the side columns swap); flip-rows / flip-columns reverse the order inside panes.
# Panes don't move; flip again to undo.
flip-twin:    {mod: mod4, key: f}
flip-rows:    {mod: mod4, key: x}
flip-columns: {mod: mod4, key: y}

# Show the layout HUD with the current layout.
display-current-layout: {mod: <NONE>, key: <NONE>}


# ─── 4 Main pane ───────────────────────────────────────────────────────────────────────────────
# Main count is a maximum ("x of y"): docs/layouts.md#main-count-is-a-maximum.

# Where a window arriving in main goes: first (on top; with main full, its last window moves out)
# | last (at the end; joins main only while main has room and the side panes are empty). Default last.
main-arrival-position: last

# How much shrink-main / expand-main change main, in percent of the screen (default 5).
window-resize-step: 5

# Main's size (5-95 % of the screen) and its maximum number of windows. Not every layout responds.
shrink-main:    {mod: mod1, key: '-'}
expand-main:    {mod: mod1, key: '='}
decrease-main:  {mod: mod2, key: '-'}
increase-main:  {mod: mod2, key: '='}

# The main window: focus it, swap the focused window with it, or move the focused window into main.
focus-main: {mod: mod1, key: m}
swap-main:  {mod: mod3, key: m}
warp-main:  {mod: mod2, key: m}

# Switch main-arrival-position between first and last until Reload Config.
toggle-main-arrival-position: {mod: <NONE>, key: <NONE>}

# set-main-pane-count takes a number (1-99) and has no key: run it from the palette,
# or open -g "ametrine://command/set-main-pane-count?value=<n>".


# ─── 5 Moving between windows ──────────────────────────────────────────────────────────────────
# By direction: docs/directional-navigation.md. Only visible tiled windows count; ties go to the
# window used most recently. Focus moves focus, warp moves the window into the pane in that
# direction, swap trades places with the window there.

focus-west:  {mod: mod1, key: h}
focus-south: {mod: mod1, key: j}
focus-north: {mod: mod1, key: k}
focus-east:  {mod: mod1, key: l}

warp-west:   {mod: mod2, key: h}
warp-south:  {mod: mod2, key: j}
warp-north:  {mod: mod2, key: k}
warp-east:   {mod: mod2, key: l}

swap-west:   {mod: mod3, key: h}
swap-south:  {mod: mod3, key: j}
swap-north:  {mod: mod3, key: k}
swap-east:   {mod: mod3, key: l}

# By order: the next window counter-clockwise / clockwise.
focus-ccw: {mod: mod1, key: left}
focus-cw:  {mod: mod1, key: right}
swap-ccw:  {mod: mod3, key: left}
swap-cw:   {mod: mod3, key: right}


# ─── 6 Screen space ────────────────────────────────────────────────────────────────────────────

# Padding modes: named virtual monitors, e.g. a centred 27" on a big display. Each sets top, left,
# right, bottom in px (left out = 0). Each Space keeps the mode picked on it, across restarts.
# Default: none.
padding-modes:
  - name: full
  - name: wide
    top: 540
  - name: "27 screen"
    left: 640
    right: 640
    top: 720

# The mode a Space starts on until you pick one there: a name from padding-modes (default none).
padding-mode: wide

# No screen padding on a built-in display: true | false (default false).
disable-padding-on-builtin-display: true

# Padding when no padding mode is active, in px (default 0 each).
screen-padding-left: 0
screen-padding-right: 0
screen-padding-top: 0
screen-padding-bottom: 0

# Margins between and around windows: true | false (default false).
window-margins: true

# Drop the margins when only one window is on the screen: true | false (default false).
smart-window-margins: false

# Margin size in px (default 0).
window-margin-size: 8

# Lay windows out over the whole screen, menu bar and Dock area included: true | false (default false).
ignore-menu-bar: false

# Next / previous padding mode on the current Space (wraps around), or a given one.
cycle-padding-mode:          {mod: mod1, key: "0"}
cycle-padding-mode-backward: {mod: <NONE>, key: <NONE>}
select-full-padding-mode:    {mod: <NONE>, key: <NONE>}
select-wide-padding-mode:    {mod: <NONE>, key: <NONE>}
"select-27 screen-padding-mode": {mod: <NONE>, key: <NONE>}


# ─── 7 Which windows tile ──────────────────────────────────────────────────────────────────────
# explain-window says why a window tiles or floats.

# Apps that float (or tile, see floating-is-blacklist), by bundle id. An entry is an id (exact, or a
# * glob) or {id: ..., window-titles: [...]} with case-sensitive regexes (use ^…$, (?i)). The first
# match wins. Default [].
floating:
  - com.apple.calculator
  - org.hammerspoon.Hammerspoon
  - net.duoziwei.KeepTop
  - com.aone.keka
  - com.hegenberg.KeyboardCleanTool
  - com.raycast.macos
  - com.knollsoft.Hookshot
  - cc.ffitch.shottr
  - pro.betterdisplay.BetterDisplay
  - com.apple.systempreferences
  - com.apple.finder
  - com.apple.ActivityMonitor
  - {id: "*", window-titles: ["^(Open|Save)$"]}

# true: the apps in floating float, all others tile | false: the opposite (default true).
floating-is-blacklist: true

# Apps whose first window on a Space tiles while their other windows (Settings, dialogs, Open
# panels) float. Ids match like floating. Default [].
floating-secondary-windows:
  - md.obsidian
  - dev.zed.Zed

# Float windows smaller than small-window-size: true | false (default true).
float-small-windows: false

# The size below which a window is small, width and height, in px (default 500).
small-window-size: 500

# The smallest a window is sized to, whatever its tile, in px (default 0 each).
window-minimum-width: 0
window-minimum-height: 0

# Float or tile the focused window; say why a window tiles or floats; lay everything out again.
toggle-float:       {mod: mod2, key: t}
explain-window:     {mod: <NONE>, key: <NONE>}
reevaluate-windows: {mod: mod2, key: r}


# ─── 8 Window limit ────────────────────────────────────────────────────────────────────────────
# docs/window-limit.md

# The most windows tiled on a screen at once: 0 (no limit) or a number (default 0).
window-max-count: 0

# A window over the limit: minimize (the oldest outside main) | float (the newest floats, centred,
# the tiles stay). Default minimize.
window-overflow: float

# The size of a window floated over the limit: reasonable (the percentages below) | fixed (the
# points below). Default reasonable.
window-overflow-size: reasonable

# reasonable: percent of the screen's usable width and height, 1-100 (default 60 and 70).
window-overflow-reasonable-width: 60
window-overflow-reasonable-height: 60

# fixed: points, never bigger than the screen; 0 = not set, fixed then uses reasonable (default 0).
window-overflow-width: 1025
window-overflow-height: 900

# Show the new window max count and overflow settings after changing them: true | false (default false).
enables-window-count-hud: true

# Say so when a tiled window stays bigger than its tile (an app's minimum size), once per window and
# tile size: true | false (default true).
enables-refused-tile-hud: true

# Change the limit by one, or switch the overflow and its size, until Reload Config.
increase-window-max-count:   {mod: <NONE>, key: <NONE>}
decrease-window-max-count:   {mod: <NONE>, key: <NONE>}
toggle-window-overflow:      {mod: mod2, key: o}
toggle-window-overflow-size: {mod: <NONE>, key: <NONE>}

# set-window-max-count takes a number (0-99, 0 = no limit) and has no key: run it from the palette,
# or open -g "ametrine://command/set-window-max-count?value=<n>".


# ─── 9 Mouse ───────────────────────────────────────────────────────────────────────────────────

# Move the mouse to the centre of a window when it gets focus: true | false (default false).
# Largely incompatible with focus-follows-mouse.
mouse-follows-focus: true

# Focus the window under the mouse as it moves: true | false (default false).
focus-follows-mouse: false

# Drag a window onto another to swap them: true | false (default false).
mouse-swaps-windows: true

# Hold Shift (alone) as you drop a dragged window to warp it into the pane under the cursor instead:
# true | false (default false).
mouse-warps-windows: true

# Resizing a window with the mouse updates the layout (main's size): true | false (default false).
mouse-resizes-windows: true

# Keep tiled windows on their tiles: a drag or resize the layout doesn't take goes back on release,
# and so does a move or resize by another app: true | false (default true).
snap-back-windows: true

# Switch snap-back-windows or focus-follows-mouse until Reload Config.
toggle-snap-back-windows:   {mod: <NONE>, key: <NONE>}
toggle-focus-follows-mouse: {mod: <NONE>, key: <NONE>}


# ─── 10 Focus border ───────────────────────────────────────────────────────────────────────────

# A ring just outside the focused window: true | false (default false). None for tiled windows in
# the Fullscreen layout or in native full screen.
focus-border: true

# glow (soft, like the macOS focus ring) | solid | gradient. Default glow.
focus-border-style: glow

# Points: the ring width for solid and gradient, how far the glow reaches (default 5).
focus-border-width: 2

# accent (the system accent colour) | "#RRGGBB" | "#AARRGGBB", quoted. Default accent.
focus-border-color: accent

# The gradient style's two colours, top left to bottom right (default ["#9B5DE5", "#F4B942"]).
focus-border-gradient: ["#9B5DE5", "#F4B942"]

# Corner radius in points, used when a window doesn't report its own (default 12).
focus-border-radius: 12

# Turn the border on or off, or switch its style, until Reload Config.
toggle-focus-border:      {mod: <NONE>, key: <NONE>}
cycle-focus-border-style: {mod: <NONE>, key: <NONE>}


# ─── 11 Feedback and app ───────────────────────────────────────────────────────────────────────

# Show a short message when the layout, padding mode or main count changes: true | false (default true).
enables-layout-hud: true

# Show the layout's name when moving to another Space: true | false (default true).
enables-layout-hud-on-space-change: true

# Hide the menu bar icon and the layout name next to it: true | false (default false).
hide-menu-bar-icon: false

# Start the menu bar title with main's count: a filled dot per window in main, an open one per free place
# (M:●○ = room for the next window), digits above three places (M:5/7), M:– for a layout without a main pane:
# true | false (default true).
menu-bar-main-count: true

# Debug information in the layout HUD: true | false (default false).
debug-layout-info: false

# Tiling on or off, and quit and reopen Ametrine (what Reload Config does).
toggle-tiling:     {mod: <NONE>, key: <NONE>}
enable-tiling:     {mod: <NONE>, key: <NONE>}
disable-tiling:    {mod: <NONE>, key: <NONE>}
relaunch-ametrine: {mod: <NONE>, key: <NONE>}
